name: Feature request
description: Suggest a change or an addition
labels: ["enhancement"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - omp-session-control
        - omp-services
        - omp-private-relay
        - omp-dashboard
        - omp-memory
        - A new plugin
        - Repository tooling (Makefile, tests, gate)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Behaviour, commands or settings you have in mind. A change that makes something on by default, or that contacts a network by default, needs a strong reason.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
